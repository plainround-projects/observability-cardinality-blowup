[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "observability-cardinality-blowup"
version = "0.1.0"
description = "A checkout app and a real Prometheus that you overload on purpose with a user_id label, diagnose from the backend's own statistics, fix by moving the detail to trace attributes, and then use traces to find a slow dependency that averaged metrics hide."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sumit Srivastava" }]
dependencies = [
    "flask>=3.1,<4",
    "waitress>=3.0,<4",
    "prometheus-client>=0.21,<1",
    "requests>=2.32,<3",
    "opentelemetry-distro>=0.66b1",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-flask>=0.66b1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "types-requests",
    "types-PyYAML",
    "pyyaml>=6",
]

[project.scripts]
cardinality-lab-app = "cardinality_lab.interfaces.main:main"
cardinality-lab-health = "cardinality_lab.interfaces.health_cli:main"
cardinality-lab-load = "cardinality_lab.lab.load_cli:main"
cardinality-lab-scenario = "cardinality_lab.lab.scenario_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tech"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT", "D100", "D101", "D103", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "waitress", "waitress.*", "prometheus_client", "prometheus_client.*"]
ignore_missing_imports = true

# prometheus_client ships no type information for this one start-up call.
[[tool.mypy.overrides]]
module = ["cardinality_lab.interfaces.main"]
disallow_untyped_calls = false

# Test functions are named for the behavior they check; annotating every one adds noise, not safety.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the stack from docker-compose.yml (make up)",
    "e2e: runs the whole lesson scenario at reduced scale against the stack (make up first)",
]

[tool.coverage.run]
source = ["cardinality_lab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "cardinality_lab"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces and lab -> infrastructure -> application -> domain, never upward"
type = "layers"
layers = [
    "cardinality_lab.interfaces | cardinality_lab.lab",
    "cardinality_lab.infrastructure",
    "cardinality_lab.application",
    "cardinality_lab.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application know nothing about web, metrics or telemetry libraries"
type = "forbidden"
source_modules = ["cardinality_lab.domain", "cardinality_lab.application"]
forbidden_modules = ["flask", "prometheus_client", "requests", "opentelemetry", "waitress"]
