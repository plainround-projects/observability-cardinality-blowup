<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="t d">
<title id="t">One run of make run in observability-cardinality-blowup</title>
<desc id="d">The Scenario measures a baseline of 669 series, adds the user_id label and sends 200,000 requests so Prometheus holds 494,226 series, reads the offending label from Prometheus's tsdb status, recreates Prometheus with the labeldrop guard, searches Tempo for one user, switches the label back on behind the guard, then finds 41 of 41 slow requests with TraceQL after the route p95 barely moved.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="839" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="838" rx="16"/>
<text class="title" x="48" y="68">One run of make run, in six steps</text>
<text class="caption" x="48" y="100">The Scenario drives the app and reads both backends. Amber rows: the label, and a p95 that hides one slow tenant.</text>
<rect class="actor" x="410" y="128" width="120" height="48" rx="24"/>
<text class="lane" x="470" y="158" text-anchor="middle">Scenario</text>
<rect class="svc" x="580" y="128" width="150" height="48" rx="10"/>
<text class="lane" x="655" y="158" text-anchor="middle">Checkout app</text>
<rect class="svc" x="775" y="128" width="140" height="48" rx="10"/>
<text class="lane" x="845" y="158" text-anchor="middle">Prometheus</text>
<rect class="svc" x="985" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="1050" y="148" text-anchor="middle">Collector</text>
<text class="lane" x="1050" y="168" text-anchor="middle">and Tempo</text>
<path class="hair" d="M470 176V692M655 176V692M845 176V692M1050 176V752"/>
<path class="hair" d="M66 216V728"/>
<circle class="dot" cx="66" cy="216" r="15"/>
<text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Baseline: three bounded labels</text>
<text class="sub" x="96" y="232">fresh Prometheus, label off</text>
<path class="sync" d="M470 216H655"/>
<text class="label t-accent" x="486" y="206">5,000 requests</text>
<rect class="slot" x="839" y="198" width="12" height="36" rx="4"/>
<text class="label t-accent" x="861" y="221">669 series</text>
<circle class="dot-w" cx="66" cy="280" r="15"/>
<text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-warn" x="96" y="276">Blow it up: add user_id</text>
<text class="sub" x="96" y="296">50,000 users, 200,000 requests</text>
<path class="fail" d="M470 280H655"/>
<text class="label t-warn" x="486" y="270">200,000 requests</text>
<rect class="note" x="839" y="262" width="12" height="36" rx="4"/>
<text class="label t-warn" x="861" y="285">494,226 series</text>
<circle class="dot" cx="66" cy="344" r="15"/>
<text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">Find the offender</text>
<text class="sub" x="96" y="360">user_id has 49,090 values</text>
<path class="read" d="M845 344H470"/>
<text class="label t-ink" x="664" y="334">/api/v1/status/tsdb</text>
<circle class="dot" cx="66" cy="408" r="15"/>
<text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">Fix: guarded Prometheus</text>
<text class="sub" x="96" y="424">label off, a fresh TSDB: 669 series</text>
<path class="sync" d="M470 408H845"/>
<text class="label t-accent" x="486" y="398">reset, guarded</text>
<circle class="dot" cx="66" cy="472" r="15"/>
<text class="num" x="66" y="477" text-anchor="middle">4b</text>
<text class="label b t-ink" x="96" y="468">Search traces for one user</text>
<text class="sub" x="96" y="488">user.id is on the span</text>
<path class="sync" d="M470 472H1050"/>
<text class="label t-accent" x="862" y="462">search user.id</text>
<circle class="dot" cx="66" cy="536" r="15"/>
<text class="num" x="66" y="541" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="532">Guard: the label comes back</text>
<text class="sub" x="96" y="552">labeldrop strips user_id</text>
<path class="sync" d="M470 536H655"/>
<text class="label t-accent" x="486" y="526">user_id back on</text>
<rect class="slot" x="839" y="518" width="12" height="36" rx="4"/>
<text class="label t-good" x="861" y="541">672 series</text>
<circle class="dot-w" cx="66" cy="600" r="15"/>
<text class="num" x="66" y="605" text-anchor="middle">6</text>
<text class="label b t-warn" x="96" y="596">A slow tenant hides in p95</text>
<text class="sub" x="96" y="616">tenant-0007, 0.51% of traffic</text>
<path class="sync" d="M470 600H655"/>
<text class="label t-accent" x="486" y="590">2 x 8,000 requests</text>
<rect class="note" x="839" y="582" width="12" height="36" rx="4"/>
<text class="label t-warn" x="861" y="605">p95 36.0 to 48.6 ms</text>
<circle class="dot" cx="66" cy="664" r="15"/>
<text class="num" x="66" y="669" text-anchor="middle">6b</text>
<text class="label b t-ink" x="96" y="660">TraceQL finds the slow ones</text>
<text class="sub" x="96" y="680">tenant, route, duration over 1 s</text>
<path class="sync" d="M470 664H1050"/>
<text class="label t-accent" x="862" y="654">TraceQL</text>
<circle class="dot-g" cx="66" cy="728" r="15"/>
<text class="num" x="66" y="733" text-anchor="middle">6c</text>
<text class="label b t-ink" x="96" y="724">Every slow request is found</text>
<text class="sub" x="96" y="744">shortest trace: 2,000 ms</text>
<path class="ok" d="M1050 728H724"/>
<rect class="win" x="424" y="708" width="300" height="40" rx="10"/>
<text class="label b t-good" x="440" y="733">41 traces of 41 slow requests</text>
<path class="sync" d="M48 796H112"/><text class="legend" x="124" y="801">sync call</text>
<path class="read" d="M520 796H584"/><text class="legend" x="596" y="801">read</text>
<path class="fail" d="M696 796H760"/><text class="legend" x="772" y="801">failure path</text>
<path class="ok" d="M928 796H992"/><text class="legend" x="1004" y="801">result</text>
</svg>
