<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="888" viewBox="0 0 1200 888" role="img" aria-labelledby="t d">
<title id="t">Architecture of observability-cardinality-blowup</title>
<desc id="d">A load generator sends GET /checkout with user and tenant headers to the Checkout app inside a Docker Compose boundary. The app calls a simulated payment gateway, is scraped by Prometheus on port 9100, and sends OTLP spans through a Collector to Tempo. Grafana reads Prometheus and Tempo. A Scenario outside the boundary recreates the app through docker compose and reads Prometheus statistics and Tempo traces. An amber edge marks the scrape that carries the user_id label.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="887" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="886" rx="16"/>
<text class="title" x="48" y="68">One checkout app, two backends, one label that breaks it</text>
<text class="caption" x="48" y="100">Amber: the user_id label that multiplies Prometheus series. Traces keep the same detail as span attributes.</text>
<rect class="actor" x="48" y="168" width="184" height="96" rx="48"/>
<text class="name" x="140" y="201" text-anchor="middle">Load generator</text>
<text class="sub" x="140" y="223" text-anchor="middle">50,000 users</text>
<text class="sub" x="140" y="243" text-anchor="middle">200 tenants</text>
<rect class="actor" x="48" y="394" width="184" height="72" rx="36"/>
<text class="name" x="140" y="426" text-anchor="middle">Scenario</text>
<text class="sub" x="140" y="448" text-anchor="middle">make run</text>
<rect class="boundary" x="264" y="132" width="888" height="568" rx="14"/>
<text class="tag" x="280" y="160">Docker Compose</text>
<rect class="svc" x="408" y="184" width="224" height="140" rx="12"/>
<text class="name" x="424" y="216">Checkout app</text>
<text class="sub" x="424" y="240">GET /checkout</text>
<text class="sub" x="424" y="262">GET /healthz</text>
<text class="sub" x="424" y="284">metrics on :9100</text>
<text class="sub" x="424" y="306">span: checkout</text>
<rect class="svc" x="760" y="184" width="240" height="84" rx="12"/>
<text class="name" x="776" y="216">Downstream call</text>
<text class="sub" x="776" y="240">SimulatedPaymentGateway</text>
<text class="sub" x="776" y="262">slow for one tenant</text>
<rect class="svc" x="760" y="300" width="240" height="96" rx="12"/>
<text class="name" x="776" y="332">Collector</text>
<text class="sub" x="776" y="356">memory_limiter</text>
<text class="sub" x="776" y="378">batch</text>
<path class="store" d="M408 404a112 12 0 0 1 224 0v102a112 12 0 0 1 -224 0z"/>
<path class="rim" d="M408 404a112 12 0 0 0 224 0"/>
<text class="name" x="520" y="441" text-anchor="middle">Prometheus</text>
<text class="sub" x="520" y="465" text-anchor="middle">series, alert rules</text>
<text class="sub" x="520" y="489" text-anchor="middle">guard: labeldrop</text>
<path class="store" d="M408 572a112 12 0 0 1 224 0v76a112 12 0 0 1 -224 0z"/>
<path class="rim" d="M408 572a112 12 0 0 0 224 0"/>
<text class="name" x="520" y="608" text-anchor="middle">Tempo</text>
<text class="sub" x="520" y="632" text-anchor="middle">one trace per request</text>
<rect class="svc" x="760" y="440" width="240" height="96" rx="12"/>
<text class="name" x="776" y="472">Grafana</text>
<text class="sub" x="776" y="496">dashboard as code</text>
<text class="sub" x="776" y="518">TraceQL table</text>
<rect class="note" x="48" y="724" width="540" height="100" rx="10"/>
<text class="label b t-warn" x="64" y="754">METRICS_INCLUDE_USER_ID=true</text>
<text class="sub" x="64" y="780">50,000 users: 669 series become 494,226 (739x)</text>
<text class="sub" x="64" y="802">labeldrop in prometheus.guarded.yml keeps 672</text>
<path class="sync" d="M232 216H408"/>
<text class="label t-accent" x="276" y="206">GET /checkout</text>
<text class="label t-accent" x="276" y="238">X-User-Id,</text>
<text class="label t-accent" x="276" y="258">X-Tenant-Id</text>
<path class="sync" d="M140 394V312Q140 300 152 300H408"/>
<text class="label t-accent" x="276" y="290">docker compose</text>
<path class="sync" d="M632 214H760"/>
<text class="label t-accent" x="640" y="204">charge</text>
<path class="async" d="M632 290H704Q716 290 716 302V336Q716 348 728 348H760"/>
<text class="label t-accent" x="640" y="280">OTLP spans</text>
<path class="fail" d="M520 324V392"/>
<text class="label t-warn" x="532" y="352">scrape :9100</text>
<text class="label t-warn" x="532" y="374">+ user_id</text>
<path class="read" d="M408 430H232"/>
<text class="label t-ink" x="276" y="420">tsdb status</text>
<path class="read" d="M632 470H760"/>
<path class="read" d="M632 600H688Q700 600 700 588V532Q700 520 712 520H760"/>
<path class="async" d="M1000 348H1020Q1032 348 1032 360V624Q1032 636 1020 636H632"/>
<text class="label t-accent" x="760" y="626">export, OTLP</text>
<path class="read" d="M408 616H152Q140 616 140 604V466"/>
<text class="label t-ink" x="276" y="606">TraceQL</text>
<path class="sync" d="M48 844H112"/><text class="legend" x="124" y="849">sync call</text>
<path class="async" d="M264 844H328"/><text class="legend" x="340" y="849">async message</text>
<path class="read" d="M520 844H584"/><text class="legend" x="596" y="849">read</text>
<path class="fail" d="M696 844H760"/><text class="legend" x="772" y="849">failure path</text>
</svg>
